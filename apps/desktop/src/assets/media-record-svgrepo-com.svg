<?xml version="1.0" encoding="utf-8"?>
<!-- Media Downloader Logo with White Background for High Contrast -->
<svg width="800px" height="800px" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" version="1.1" id="svg2">
  <!-- Nền trắng tròn giúp làm nổi bật viền đen và tâm đỏ -->
  <circle cx="8" cy="8" r="8" fill="#ffffff" id="bg-white" />
  
  <!-- Viền đen ngoài (Outer ring) -->
  <path id="path828" d="M8 1a7 7 0 0 0-7 7 7 7 0 0 0 7 7 7 7 0 0 0 7-7 7 7 0 0 0-7-7zm0 1a6 6 0 0 1 6 6 6 6 0 0 1-6 6 6 6 0 0 1-6-6 6 6 0 0 1 6-6z" style="opacity:1;fill:#1e2024;fill-opacity:1;stroke:none;" />
  
  <!-- Tâm đỏ ghi hình (Center red record circle) -->
  <circle r="3" cy="8" cx="8" id="path833" style="opacity:1;fill:#da4453;fill-opacity:1;stroke:none;" />
</svg>