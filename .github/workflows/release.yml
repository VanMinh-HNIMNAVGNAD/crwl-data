name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Phiên bản tag phát hành (ví dụ: v0.1.1)'
        required: false
        default: 'v0.1.1'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libfuse2

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          projectPath: 'apps/desktop'
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Social Media Crawler ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            ## 🚀 Social Media Crawler ${{ github.event.inputs.tag || github.ref_name }}
            
            Bản phát hành chính thức đồng thời cho cả **Linux** và **Windows** với kết nối Supabase Cloud Database.

            ### 📦 Tệp cài đặt đính kèm cho cả 2 hệ điều hành:

            #### 🐧 Linux (Ubuntu, Debian, Fedora, Arch...):
            - `social-media-crawler_amd64.AppImage`: Chạy trực tiếp, không cần cài đặt
            - `social-media-crawler_amd64.deb`: Gói cài đặt cho Ubuntu / Debian / Linux Mint

            #### 🪟 Windows (Windows 10 / 11):
            - `social-media-crawler_x64-setup.exe`: Trình cài đặt tự động (NSIS Setup - Khuyên dùng)
            - `social-media-crawler_x64_en-US.msi`: Gói Windows Installer (.msi)
          releaseDraft: false
          prerelease: false
