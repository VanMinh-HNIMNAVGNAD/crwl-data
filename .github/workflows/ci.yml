name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Push mới lên cùng một PR thì huỷ lượt chạy cũ cho đỡ tốn phút CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Version khớp nhau ở mọi file
        run: pnpm version:check

      - run: pnpm lint
      - run: pnpm test:ui
      - run: pnpm build

  backend:
    name: Rust + Python core
    # Cùng bản Ubuntu với release.yml để có libwebkit2gtk-4.1.
    runs-on: ubuntu-22.04
    env:
      # Test gọi YouTube/TikTok thật hay bị chặn bot trên IP của GitHub -> bỏ qua trong CI.
      CRWL_SKIP_NETWORK_TESTS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Cài thư viện hệ thống (Tauri + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        # Hai lint thiết kế này đang có sẵn trong code cũ; mọi cảnh báo khác đều chặn PR.
        run: cargo clippy --all-targets -- -D warnings -A clippy::too_many_arguments -A clippy::type_complexity

      - name: Cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # Một số test Python gọi lại pnpm lint/build nên job này cũng cần Node.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài dependency Python
        run: pip install pytest yt-dlp gallery-dl curl_cffi requests

      - name: Pytest
        run: pytest scripts -q
